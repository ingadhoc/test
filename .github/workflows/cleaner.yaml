name: Delete PR branch from fork and base repo

on:
  pull_request:
    types: [closed]

  # Trigger manual
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull Request number to delete the branch'
        required: true
        type: number

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'ingadhoc' && (github.event_name == 'pull_request' && github.event.pull_request.merged == false && github.event.pull_request.user.login == 'roboadhoc' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Delete branch from base and fork repos
        uses: actions/github-script@v6
        id: pr_data_fetcher
        with:
          github-token: ${{ github.token }}
          script: |
            // Determine the PR number and repo context based on the trigger
            let prNumber;
            let repoOwner;
            let repoName;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              repoOwner = context.repo.owner;
              repoName = context.repo.repo;
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pull_request_number;
              // For manual trigger, we need to get the repo info from the context
              repoOwner = context.repo.owner;
              repoName = context.repo.repo;
            }

            // Fetch the PR data using the number
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber,
            });

            const headRepo = pullRequest.head.repo;
            const baseRepo = { owner: repoOwner, repo: repoName, full_name: `${repoOwner}/${repoName}` };
            const baseBranchName = pullRequest.head.ref;
            const userLogin = pullRequest.user.login;

            // Validation for the manual trigger
            if (context.eventName === 'workflow_dispatch' && pullRequest.merged === true) {
              console.log(`PR #${prNumber} was merged. No action needed.`);
              core.setOutput('validation_passed', 'false');
              return;
            }

            // Fetch the PR timeline to find the 'closed' event
            const timeline = await github.rest.issues.listEventsForTimeline({
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber,
            });

            // Find the 'closed' event in the timeline
            const closeEvent = timeline.data.find(event => event.event === 'closed');

            // Get the user who closed the PR from the event
            const closedByLogin = closeEvent && closeEvent.actor ? closeEvent.actor.login : null;

            if (context.eventName === 'workflow_dispatch' && closedByLogin !== 'roboadhoc') {
              console.log(`PR #${prNumber} was not closed by 'roboadhoc' (${closedByLogin}). No action needed.`);
              core.setOutput('validation_passed', 'false');
              return;
            }

            // Set outputs for subsequent steps
            core.setOutput('validation_passed', 'true');
            core.setOutput('base_branch_name', pullRequest.head.ref);
            core.setOutput('head_repo_full_name', pullRequest.head.repo.full_name);
            core.setOutput('head_repo_owner', pullRequest.head.repo.owner.login);
            core.setOutput('head_repo_name', pullRequest.head.repo.name);
            core.setOutput('base_repo_owner', context.repo.owner);
            core.setOutput('base_repo_name', context.repo.repo);
            core.setOutput('is_fork', pullRequest.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo);

      - name: Delete branch from the base repository
        uses: actions/github-script@v6
        if: ${{ steps.pr_data_fetcher.outputs.validation_passed == 'true' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const baseBranchName = `${{ steps.pr_data_fetcher.outputs.base_branch_name }}`;
            const baseRepoOwner = `${{ steps.pr_data_fetcher.outputs.base_repo_owner }}`;
            const baseRepoName = `${{ steps.pr_data_fetcher.outputs.base_repo_name }}`;
            try {
              console.log(`Attempting to delete branch '${baseBranchName}' from base repo '${baseRepoOwner}/${baseRepoName}'`);
              await github.rest.git.deleteRef({
                owner: baseRepoOwner,
                repo: baseRepoName,
                ref: `heads/${baseBranchName}`,
              });
              console.log(`Branch '${baseBranchName}' deleted from base repo successfully.`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch '${baseBranchName}' in base repo already deleted. No action needed.`);
              } else {
                console.error(`Error deleting branch '${baseBranchName}' from base repo: ${error.message}`);
              }
            }
      - name: Delete branch from the fork repository
        if: ${{ steps.pr_data_fetcher.outputs.validation_passed == 'true' && steps.pr_data_fetcher.outputs.is_fork == 'true' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.EXTERNAL_REPO_TOKEN_CLEANER_ADHOC_DEV || github.token }}
          script: |
            const baseBranchName = `${{ steps.pr_data_fetcher.outputs.base_branch_name }}`;
            const headRepoOwner = `${{ steps.pr_data_fetcher.outputs.head_repo_owner }}`;
            const headRepoName = `${{ steps.pr_data_fetcher.outputs.head_repo_name }}`;

            try {
              console.log(`PR comes from a fork. Attempting to delete branch from fork repo '${headRepoOwner}/${headRepoName}'`);
              await github.rest.git.deleteRef({
                owner: headRepoOwner,
                repo: headRepoName,
                ref: `heads/${baseBranchName}`,
              });
              console.log(`Branch '${baseBranchName}' deleted from fork repo successfully.`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch '${baseBranchName}' in fork repo already deleted. No action needed.`);
              } else {
                console.error(`Error deleting branch '${baseBranchName}' from fork repo: ${error.message}`);
              }
            }